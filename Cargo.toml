[package]
name = "lantun"
version = "0.1.0"
edition = "2024"

[dependencies]
iroh = "0.95.1"
tokio = { version = "1.48.0", features = [
    "rt",
    "rt-multi-thread",
    "time",
    "macros",
    "net",
] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
serde = { version = "1.0.219", features = ["derive"] }
hex = "0.4.3"
dirs = "6.0.0"
color-eyre = "0.6.5"
clap = { version = "4.5.53", features = ["derive", "string"] }
ratatui = "0.29.0"
thiserror = "2.0.17"
toml = "0.9.8"
rand = "0.9.2"
